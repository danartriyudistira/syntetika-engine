<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24242B"/>
      <stop offset="1" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB15C"/>
      <stop offset="0.5" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#F26A0D"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- macOS-style rounded square -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64.5" y="64.5" width="895" height="895" rx="199.5" fill="none" stroke="#3A3A45" stroke-width="3"/>

  <!-- orange audio waveform forming an S -->
  <path d="M 690 300
           C 690 232 620 208 520 208
           C 420 208 344 250 344 320
           C 344 392 420 420 512 440
           C 608 462 680 492 680 568
           C 680 648 600 700 500 700
           C 404 700 336 664 330 600"
        fill="none" stroke="url(#wave)" stroke-width="64" stroke-linecap="round" filter="url(#glow)"/>

  <!-- video frame corner, violet -->
  <path d="M 812 196 L 812 344 M 812 196 L 664 196" fill="none" stroke="#9B8CFF" stroke-width="30" stroke-linecap="round"/>

  <!-- small teal accent dot -->
  <circle cx="770" cy="770" r="26" fill="#4FD1C5"/>
</svg>
